<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MUSE for UZU</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236557d9'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='20' fill='white'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">✦</span><div><strong>MUSE for UZU</strong><small>Mystery Understanding &amp; Story Engineering</small></div></div>
    <div class="top-actions"><span class="local-badge">LOCAL ONLY</span><button id="saveBtn">保存</button><button id="exportBtn" class="secondary">JSON書出し</button><label class="button secondary">JSON読込<input id="importInput" type="file" accept="application/json" hidden></label></div>
  </header>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="scenario-card"><span>SCENARIO</span><input id="scenarioTitle" /></div>
      <nav id="nav">
        <button class="nav-item active" data-view="overview">◈ <span>Overview</span></button>
        <button class="nav-item" data-view="flow">⌁ <span>FLOW / シーン</span></button>
        <button class="nav-item" data-view="characters">♙ <span>Characters</span></button>
        <button class="nav-item" data-view="clues">◇ <span>Clues / 情報</span></button>
        <button class="nav-item" data-view="logic">⚙ <span>Logic / 条件</span></button>
        <button class="nav-item" data-view="mystery">✧ <span>Mystery Graph</span></button>
        <button class="nav-item" data-view="balance">◉ <span>Balance / 配点</span></button>
        <button class="nav-item" data-view="output">⇩ <span>UZU Blueprint</span></button>
      </nav>
      <div class="sidebar-foot"><small>データはこのブラウザ内に保存</small><button id="resetBtn" class="text-button">サンプルに戻す</button></div>
    </aside>
    <main id="main" class="main"></main>
  </div>
  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
